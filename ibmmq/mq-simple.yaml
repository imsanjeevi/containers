apiVersion: v1
kind: Pod
metadata:
  name: ibmmq-simple
  namespace: middleware
  labels:
    app: ibmmq-dev
spec:
  containers:
    - name: ibmmq
      #image: icr.io/ibm-messaging/mq:latest
      image: 172.27.8.7:8080/middleware/mq:v290126
      ports:
        - containerPort: 1414
        - containerPort: 9443
        - containerPort: 9157
      env:
        - name: LICENSE
          value: "accept"
        - name: MQ_QMGR_NAME
          value: "QM1"
        - name: MQ_ADMIN_PASSWORD
          value: "passw0rd"
        - name: MQ_ENABLE_METRICS
          value: "true"
